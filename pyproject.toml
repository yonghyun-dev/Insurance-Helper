[project]
name = "insurance-claim-assistant"
version = "0.1.0"
description = "보험청구심사 어시스턴트 — 약관 RAG 기반 청구 가능성 평가 도구"
requires-python = ">=3.11"
authors = [{ name = "DFocus" }]
readme = "README.md"

dependencies = [
    # PDF 파싱
    "pdfplumber>=0.11.0",
    "pymupdf>=1.24.0",

    # 데이터베이스
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",

    # 벡터 DB
    "chromadb>=0.5.0",

    # LLM / 임베딩
    "openai>=1.30.0",
    "tiktoken>=0.7.0",

    # 설정 / 검증
    "pydantic[email]>=2.7.0",   # [email] = email-validator (users EmailStr 필요)
    "pydantic-settings>=2.3.0",

    # CLI
    "typer>=0.12.0",
    "rich>=13.7.0",

    # HTTP / 재시도
    "httpx>=0.27.0",
    "tenacity>=8.3.0",

    # HTTP API (Sprint 2 활성화, Sprint 1 에서는 healthcheck 만 동작)
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",

    # Sprint 4 — GraphRAG / LangChain / Neo4j (app/rag/ 격리 도입)
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-chroma>=0.1.4",
    "langchain-neo4j>=0.1.0",
    "neo4j>=5.20.0",

    # Sprint 8 — 대국민 서비스 운영 기반
    "slowapi>=0.1.9",            # rate limit 미들웨어
    "pybreaker>=1.2.0",          # circuit breaker (외부 API + Neo4j)
    "prometheus-client>=0.20.0", # /metrics exposition
    "psycopg[binary]>=3.1.0",    # PostgreSQL 드라이버 (SQLite 기본, DATABASE_URL 로 전환)

    # Sprint 9 — 외부 API 어댑터
    "cachetools>=5.3.0",         # TTL 캐시 (law 30d / hira 7d / fss 24h)

    # Sprint 12 — pgvector (REQ-13) — PostgreSQL 벡터 확장
    "pgvector>=0.3.0",           # SQLAlchemy Vector 타입 + 거리 연산자 (<=>, <->, <#>)

    # Sprint 13 — LangGraph (REQ-12) — Agent 오케스트레이션 표준 StateGraph
    "langgraph>=0.2.0",          # StateGraph + 조건 엣지 + 시각화 (draw_mermaid)

    # Sprint 14 — JWT 인증 (REQ-10) — 자체 JWT + bcrypt
    "python-jose[cryptography]>=3.3.0",  # JWT 발급/검증
    "passlib[bcrypt]>=1.7.4",            # bcrypt 비밀번호 해시
    # passlib 1.7.4(2020)는 bcrypt 4.1+ 의 __about__ 제거와 비호환 → 4.0.x 로 고정
    # (bcrypt 5.0 사용 시 'module bcrypt has no __about__' + 72바이트 오류로 해시 실패)
    "bcrypt<4.1",

    # Sprint 15 — OCR 서류 처리 (REQ-11) — multipart 업로드 + APScheduler TTL
    "python-multipart>=0.0.9",  # FastAPI UploadFile multipart 파싱
    "apscheduler>=3.10.4",      # 첨부 파일 24h TTL cleanup
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    # Sprint 12 — pgvector 어댑터 단위/동등성 테스트용 ephemeral PostgreSQL+pgvector
    "testcontainers[postgres]>=4.0.0",
]

[project.scripts]
ica = "app.interfaces.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]
extend-exclude = [
    ".claude",              # agent 스킬/템플릿/훅 — 프로젝트 코드 아님
    "alembic/versions",     # 자동 생성 마이그레이션 — 손대지 않는다
    "alembic/env.py",       # alembic 보일러플레이트
]

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle / pyflakes
    "I",            # isort
    "UP",           # pyupgrade
    "B",            # flake8-bugbear
    "SIM",          # flake8-simplify
]
ignore = [
    "E501",  # 라인 길이는 100으로 가져가되 docstring 등은 유연하게
    "E702",  # `table.add_column("a"); table.add_column("b")` 같은 typer/rich 테이블 패턴 허용
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q -m 'not eval'"
markers = [
    "pgvector_integration: requires PostgreSQL+pgvector via testcontainers (needs Docker)",
    "eval: retrieval golden-set regression (needs indexed app.db + Upstage API key; run with -m eval)",
]
