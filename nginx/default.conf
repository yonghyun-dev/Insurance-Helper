# nginx — 정적 프론트(SPA) 서빙 + /api·/static 백엔드 리버스프록시 + LB
#
# 핵심: 백엔드는 compose 서비스명 `backend` 로 노출되고 --scale 로 N개 replica 가 뜬다.
# 오픈소스 nginx 는 upstream 을 시작 시 1회만 DNS 해석하므로, 변수 proxy_pass +
# Docker 임베디드 DNS(resolver 127.0.0.11) 로 매 요청 런타임 재해석해야 N replica 에 분산된다.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 업로드(약관/서류 OCR) 여유
    client_max_body_size 20m;

    # Docker 임베디드 DNS — backend 를 런타임 재해석(스케일 반영)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # LB 검증용 — 어느 backend replica 가 처리했는지 응답 헤더로 노출
    add_header X-Upstream $upstream_addr always;

    # 정적 자산 캐시 (해시 파일명)
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API — 동일 origin(쿠키 자동 전송, CORS 불필요)
    location /api/ {
        set $backend "backend:8000";
        proxy_pass http://$backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;          # Solar 스트리밍/장시간 응답 대비
        proxy_read_timeout 120s;      # Solar 추론 대기
    }

    # 백엔드 정적(PDF 원본 / 페이지 캡처 이미지)
    location /static/ {
        set $backend "backend:8000";
        proxy_pass http://$backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 헬스/메트릭 패스스루
    location = /health {
        set $backend "backend:8000";
        proxy_pass http://$backend$request_uri;
    }

    # SPA 폴백 — 그 외 경로는 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
