# Sprint 32 T2 — Memgraph (뉴로심볼릭 심볼릭 채널의 그래프 스토어)
#
# Neo4j 대체 (비용·경량). Bolt 프로토콜 호환이라 기존 neo4j 파이썬 드라이버 그대로 사용.
#
# 사용법:
#   docker compose -f docker-compose.memgraph.yml up -d
#   ica graph-build      # SQLite → 그래프 전체 재빌드 (멱등. ingest 는 문서 단위 자동 동기화)
#
# Bolt: bolt://localhost:7687 (GRAPH_URI). 인증 없음(로컬 전용) — 운영 배포 시
# MEMGRAPH_USER/MEMGRAPH_PASSWORD 환경변수로 계정 지정 가능.

services:
  memgraph:
    image: memgraph/memgraph:latest
    container_name: ica-memgraph
    ports:
      - "7687:7687"
    command: ["--log-level=WARNING", "--also-log-to-stderr"]
    volumes:
      - memgraph_data:/var/lib/memgraph
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1;' | mgconsole --host 127.0.0.1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  memgraph_data:
