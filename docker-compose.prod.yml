# 올인원 VM 배포 compose (1환경, 비용 최소)
#
# VM 1대에 nginx + backend + postgres(pgvector 컨테이너) 전부. 관리형 PG 없음.
# 이미지는 ACR 에서 pull (REGISTRY/IMAGE_TAG 는 .env, GitHub Actions 가 기록).
# 백엔드 1 replica (세션 affinity 이슈 없음).
#
# VM 배치: /opt/ica/docker-compose.prod.yml + /opt/ica/.env + /opt/ica/data/demo (Actions 가 배포)
# 데이터 적재(1회): PDF 를 /opt/ica/data/raw 에 둔 뒤
#   docker compose -f docker-compose.prod.yml run --rm migrate ica ingest
# TLS: 현재 80. 도메인 연결 후 nginx+certbot(443) 추가 — Track D2.

name: ica

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://ica:${POSTGRES_PASSWORD}@postgres:5432/ica_db
  VECTOR_STORE: pgvector
  GRAPH_URI: bolt://memgraph:7687

services:
  # Sprint 32 — 뉴로심볼릭 심볼릭 채널 그래프 스토어 (다운이어도 검색은 뉴럴 단독 graceful)
  memgraph:
    image: memgraph/memgraph:latest
    command: ["--log-level=WARNING", "--also-log-to-stderr"]
    volumes:
      - ica-memgraph-data:/var/lib/memgraph
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ica_db
      POSTGRES_USER: ica
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - ica-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ica -d ica_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 배포 시 1회: alembic 마이그레이션(vector(4096)) + 데모 페르소나 시드
  migrate:
    image: ${REGISTRY}/ica-backend:${IMAGE_TAG}
    env_file: [.env]
    environment:
      <<: *backend-env
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && ica seed-demo"]
    restart: "no"

  backend:
    image: ${REGISTRY}/ica-backend:${IMAGE_TAG}
    env_file: [.env]
    environment:
      <<: *backend-env
      DEMO_SEED_ON_STARTUP: "false"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    restart: unless-stopped

  web:
    image: ${REGISTRY}/ica-web:${IMAGE_TAG}
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  ica-pg-data:
  ica-memgraph-data:
