# GitHub Actions — main 푸시 시 올인원 VM 자동 배포 (1환경)
#
# 선행 (Track A 후):
#   - ACR + VM 1대(docker, /opt/ica). bash infra/azure/provision.sh
#   - 리포 시크릿 (bash infra/azure/set-github-secrets.sh 가 등록):
#       ACR_LOGIN_SERVER, ACR_USERNAME, ACR_PASSWORD
#       VM_HOST, VM_USER, VM_SSH_KEY
#       POSTGRES_PASSWORD, UPSTAGE_API_KEY, JWT_SECRET_KEY, PUBLIC_ORIGIN

name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: main-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: ACR 로그인
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 백엔드 이미지 빌드·푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/ica-backend:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: web 이미지 빌드·푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/ica-web:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: compose + 데모데이터 VM 동기화
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "docker-compose.prod.yml,data/demo"
          target: /opt/ica

      - name: VM 배포 (SSH → compose pull & up)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/ica
            umask 077
            cat > .env <<EOF
            REGISTRY=${{ secrets.ACR_LOGIN_SERVER }}
            IMAGE_TAG=${{ env.IMAGE_TAG }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            VECTOR_STORE=pgvector
            DEMO_SEED_ON_STARTUP=false
            UPSTAGE_API_KEY=${{ secrets.UPSTAGE_API_KEY }}
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            CORS_ALLOW_ORIGINS=${{ secrets.PUBLIC_ORIGIN }}
            EOF
            echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ secrets.ACR_LOGIN_SERVER }} -u ${{ secrets.ACR_USERNAME }} --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
